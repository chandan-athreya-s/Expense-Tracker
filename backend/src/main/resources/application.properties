spring.application.name=ExpenseTracker

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/expense_tracker}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Temporary: lets Hibernate create/adjust tables for us while learning.
# We will replace this with Flyway migrations once the schema stabilizes.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false